<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login — Scholarship Portal</title>

    <link rel="stylesheet" href="portal.css">
</head>

<body>

    <header class="portal-header">
        <h1>
            <svg class="seal" viewBox="0 0 40 40" fill="none"
                xmlns="http://www.w3.org/2000/svg">

                <circle cx="20" cy="20" r="18"
                    stroke="#C89B3C" stroke-width="2"/>

                <path
                    d="M20 10L23 17H30L24.5 21.5L26.5 29L20 24.5L13.5 29L15.5 21.5L10 17H17L20 10Z"
                    fill="#C89B3C"/>
            </svg>

            Scholarship Portal
        </h1>
    </header>


    <main class="container login-container">

        <h2>Admin Login</h2>

        <p class="form-section-title">
            Login to manage scholarship applications
        </p>

        <form id="adminLoginForm">

            <div class="form-group">

                <label class="label" for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="input-field"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label class="label" for="password">
                    Password
                </label>

                <div style="display:flex; gap:10px;">

                    <input
                        type="password"
                        id="password"
                        class="input-field"
                        placeholder="Enter password"
                        required
                        style="flex:1;"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="button"
                        style="width:auto; padding:0 15px;"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                class="button"
                type="submit"
            >
                Login as Admin
            </button>

        </form>

    </main>


    <script>

        // Show / Hide password

        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "Hide";

            } else {

                password.type = "password";
                togglePassword.textContent = "Show";

            }

        });


        // Admin Login

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const email =
                    document.getElementById("email").value;

                const passwordValue =
                    document.getElementById("password").value;


                try {

                    const response = await fetch(
                        "http://localhost:5000/api/admin-login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: passwordValue
                            })
                        }
                    );


                    const data = await response.json();


                    if (response.ok) {

                        localStorage.setItem(
                            "adminToken",
                            data.token
                        );

                        localStorage.setItem(
                            "admin",
                            JSON.stringify(data.admin)
                        );

                        alert("Admin login successful!");

                        window.location.href =
                            "AdminDashboard.html";

                    } else {

                        alert(
                            data.error ||
                            "Invalid admin email or password."
                        );

                    }

                } catch (error) {

                    console.error(error);

                    alert(
                        "Could not connect to the server."
                    );

                }

            });

    </script>

</body>
</html>
