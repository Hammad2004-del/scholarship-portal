<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard — Scholarship Portal</title>

    <link rel="stylesheet" href="portal.css">

    <style>
        /* ==============================
           STUDENT DASHBOARD
           ============================== */

        .dashboard-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 24px 50px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            margin-bottom: 4px;
        }

        .welcome-text {
            margin: 5px 0 0;
            color: var(--slate);
            font-size: 0.95rem;
        }

        /* Logout */
        .logout-button {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
            padding: 10px 20px;
        }

        .logout-button:hover {
            background: #963923;
            border-color: #963923;
        }

        /* Student information */
        .student-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
        }

        .student-card h3 {
            margin-bottom: 18px;
        }

        .student-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .info-item {
            background: #f7f8fb;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 15px;
        }

        .info-label {
            display: block;
            color: var(--slate);
            font-size: 0.78rem;
            margin-bottom: 5px;
        }

        .info-value {
            display: block;
            color: var(--navy);
            font-weight: 700;
            word-break: break-word;
        }

        /* Applications */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .application-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
        }

        .application-card h3 {
            margin-bottom: 18px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--success-bg);
            color: var(--success);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .status-pending {
            background: #FFF3CD;
            color: #856404;
        }

        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-rejected {
            background: var(--error-bg);
            color: var(--error);
        }

        .application-details p {
            margin: 10px 0;
            font-size: 0.9rem;
            color: var(--slate);
        }

        .application-details strong {
            color: var(--navy);
        }

        .no-application {
            color: var(--slate);
            font-size: 0.9rem;
            padding: 10px 0;
        }

        /* Refresh */
        .refresh-button {
            margin-top: 25px;
        }

        /* Error */
        .error-message {
            background: var(--error-bg);
            color: var(--error);
            border-left: 3px solid var(--error);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
        }

        /* Loading */
        .loading {
            color: var(--slate);
        }

        /* Mobile */
        @media (max-width: 700px) {
            .dashboard-container {
                padding: 0 15px 40px;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .student-info {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .logout-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         HEADER
         ============================== -->

    <header class="portal-header">
        <h1>
            <svg
                class="seal"
                viewBox="0 0 40 40"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <circle
                    cx="20"
                    cy="20"
                    r="18"
                    stroke="#C89B3C"
                    stroke-width="2"
                />

                <path
                    d="M20 10L23 17H30L24.5 21.5L26.5 29L20 24.5L13.5 29L15.5 21.5L10 17H17L20 10Z"
                    fill="#C89B3C"
                />
            </svg>

            Scholarship Portal
        </h1>
    </header>


    <!-- ==============================
         DASHBOARD
         ============================== -->

    <div class="dashboard-container">

        <!-- Dashboard Header -->

        <div class="dashboard-header">

            <div>
                <h2>Student Dashboard</h2>

                <p
                    id="welcome-message"
                    class="welcome-text"
                >
                    Welcome!
                </p>
            </div>

            <button
                id="logout-button"
                class="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>


        <!-- Error Message -->

        <div
            id="error-message"
            class="error-message"
            style="display:none;"
        ></div>


        <!-- ==============================
             STUDENT INFORMATION
             ============================== -->

        <div class="student-card">

            <h3>Student Information</h3>

            <div class="student-info">

                <div class="info-item">
                    <span class="info-label">
                        Full Name
                    </span>

                    <span
                        id="student-name"
                        class="info-value"
                    >
                        Loading...
                    </span>
                </div>


                <div class="info-item">
                    <span class="info-label">
                        Email
                    </span>

                    <span
                        id="student-email"
                        class="info-value"
                    >
                        Loading...
                    </span>
                </div>


                <div class="info-item">
                    <span class="info-label">
                        Student ID
                    </span>

                    <span
                        id="student-id"
                        class="info-value"
                    >
                        Loading...
                    </span>
                </div>

            </div>

        </div>


        <!-- ==============================
             APPLICATIONS
             ============================== -->

        <div class="dashboard-grid">

            <!-- Fresh Application -->

            <div class="application-card">

                <h3>Fresh Scholarship Application</h3>

                <div id="fresh-application">
                    <p class="loading">
                        Checking application status...
                    </p>
                </div>

            </div>


            <!-- Renewal Application -->

            <div class="application-card">

                <h3>Scholarship Renewal</h3>

                <div id="renewal-application">
                    <p class="loading">
                        Checking renewal status...
                    </p>
                </div>

            </div>

        </div>


        <!-- Refresh Button -->

        <button
            id="refresh-button"
            class="refresh-button"
            type="button"
        >
            Refresh Status
        </button>

    </div>


    <!-- ==============================
         JAVASCRIPT
         ============================== -->

    <script>

        /* ==============================
           GET ELEMENTS
           ============================== */

        const studentName =
            document.getElementById("student-name");

        const studentEmail =
            document.getElementById("student-email");

        const studentId =
            document.getElementById("student-id");

        const welcomeMessage =
            document.getElementById("welcome-message");

        const freshApplication =
            document.getElementById("fresh-application");

        const renewalApplication =
            document.getElementById("renewal-application");

        const errorMessage =
            document.getElementById("error-message");


        /* ==============================
           GET TOKEN
           ============================== */

        const token =
            localStorage.getItem("token");


        /* ==============================
           CHECK LOGIN
           ============================== */

        if (!token) {

            alert("Please login first.");

            window.location.href =
                "Renewal.html";
        }


        /* ==============================
           LOAD STUDENT INFORMATION
           ============================== */

        function loadStudentInformation() {

            const studentData =
                localStorage.getItem("student");

            if (!studentData) {

                studentName.textContent =
                    "Student";

                studentEmail.textContent =
                    "Not available";

                studentId.textContent =
                    "Not available";

                return;
            }

            try {

                const student =
                    JSON.parse(studentData);

                studentName.textContent =
                    student.full_name || "Student";

                studentEmail.textContent =
                    student.email || "Not available";

                studentId.textContent =
                    student.id || "Not available";

                welcomeMessage.textContent =
                    `Welcome, ${student.full_name || "Student"}!`;

            } catch (error) {

                console.error(
                    "Student information error:",
                    error
                );
            }
        }


        /* ==============================
           FORMAT DATE
           ============================== */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "Not available";
            }

            const date =
                new Date(dateValue);

            if (isNaN(date.getTime())) {
                return dateValue;
            }

            return date.toLocaleString();
        }


        /* ==============================
           LOAD APPLICATION STATUS
           ============================== */

        async function loadApplicationStatus() {

            freshApplication.innerHTML =
                `<p class="loading">
                    Checking application status...
                </p>`;

            renewalApplication.innerHTML =
                `<p class="loading">
                    Checking renewal status...
                </p>`;

            errorMessage.style.display =
                "none";

            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/applications/me",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();


                /* Invalid token */

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("student");

                    alert(
                        "Your login session has expired. Please login again."
                    );

                    window.location.href =
                        "Renewal.html";

                    return;
                }


                /* Other errors */

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Could not load application information."
                    );
                }


                /* Get application arrays */

                const applications =
                    Array.isArray(data.applications)
                        ? data.applications
                        : [];

                const renewals =
                    Array.isArray(data.renewals)
                        ? data.renewals
                        : [];


                /* ==============================
                   FRESH APPLICATION
                   ============================== */

                if (applications.length === 0) {

                    freshApplication.innerHTML = `
                        <p class="no-application">
                            No fresh scholarship application
                            has been submitted yet.
                        </p>
                    `;

                } else {

                    const latest =
                        applications[0];

                    const applicationId =
                        latest.id ??
                        latest.application_id ??
                        latest.applicationId;

                    const course =
                        latest.course ||
                        "Not available";

                    const university =
                        latest.university ||
                        "Not available";

                    const submittedAt =
                        latest.submitted_at ??
                        latest.submittedAt ??
                        latest.created_at ??
                        latest.createdAt;

                    const applicationStatus =
                        latest.status ||
                        "pending";

                    freshApplication.innerHTML = `

                        <span class="status-badge status-${applicationStatus}">
                            ${applicationStatus.toUpperCase()}
                        </span>

                        <div class="application-details">

                            ${
                                applicationId !== undefined
                                ? `
                                    <p>
                                        <strong>
                                            Application ID:
                                        </strong>
                                        ${applicationId}
                                    </p>
                                `
                                : ""
                            }

                            <p>
                                <strong>
                                    Course:
                                </strong>
                                ${course}
                            </p>

                            <p>
                                <strong>
                                    University:
                                </strong>
                                ${university}
                            </p>

                            ${
                                submittedAt
                                ? `
                                    <p>
                                        <strong>
                                            Submitted:
                                        </strong>
                                        ${formatDate(submittedAt)}
                                    </p>
                                `
                                : ""
                            }

                        </div>
                    `;
                }


                /* ==============================
                   RENEWAL APPLICATION
                   ============================== */

                if (renewals.length === 0) {

                    renewalApplication.innerHTML = `
                        <p class="no-application">
                            No renewal application
                            has been submitted yet.
                        </p>
                    `;

                } else {

                    const latest =
                        renewals[0];

                    const renewalId =
                        latest.id ??
                        latest.renewal_id ??
                        latest.renewalId;

                    const year =
                        latest.year_of_study ??
                        latest.yearOfStudy ??
                        latest.current_year_of_study ??
                        latest.currentYearOfStudy;

                    const submittedAt =
                        latest.submitted_at ??
                        latest.submittedAt ??
                        latest.created_at ??
                        latest.createdAt;

                    const renewalStatus =
                        latest.status ||
                        "pending";

                    renewalApplication.innerHTML = `

                        <span class="status-badge status-${renewalStatus}">
                            ${renewalStatus.toUpperCase()}
                        </span>

                        <div class="application-details">

                            ${
                                renewalId !== undefined
                                ? `
                                    <p>
                                        <strong>
                                            Renewal ID:
                                        </strong>
                                        ${renewalId}
                                    </p>
                                `
                                : ""
                            }

                            ${
                                year !== undefined
                                ? `
                                    <p>
                                        <strong>
                                            Year of Study:
                                        </strong>
                                        ${year}
                                    </p>
                                `
                                : ""
                            }

                            ${
                                submittedAt
                                ? `
                                    <p>
                                        <strong>
                                            Submitted:
                                        </strong>
                                        ${formatDate(submittedAt)}
                                    </p>
                                `
                                : ""
                            }

                        </div>
                    `;
                }

            } catch (error) {

                console.error(
                    "Dashboard error:",
                    error
                );

                freshApplication.innerHTML = "";
                renewalApplication.innerHTML = "";

                errorMessage.textContent =
                    error.message ||
                    "Could not connect to the server.";

                errorMessage.style.display =
                    "block";
            }
        }


        /* ==============================
           LOGOUT
           ============================== */

        document
            .getElementById("logout-button")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem("token");
                    localStorage.removeItem("student");

                    alert(
                        "You have been logged out."
                    );

                    window.location.href =
                        "Renewal.html";
                }
            );


        /* ==============================
           REFRESH STATUS
           ============================== */

        document
            .getElementById("refresh-button")
            .addEventListener(
                "click",
                loadApplicationStatus
            );


        /* ==============================
           INITIAL LOAD
           ============================== */

        loadStudentInformation();
        loadApplicationStatus();

    </script>

</body>
</html>
