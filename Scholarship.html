<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>

    <header class="portal-header">
        <h1>
            <svg class="seal" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" stroke="#C89B3C" stroke-width="2"/>
                <path d="M20 10L23 17H30L24.5 21.5L26.5 29L20 24.5L13.5 29L15.5 21.5L10 17H17L20 10Z" fill="#C89B3C"/>
            </svg>
            Scholarship Portal
        </h1>
        <p class="tagline">Financial aid registration for undergraduate &amp; postgraduate students</p>
    </header>

    <main class="page">
        <div class="option-grid">
            <div class="option-card">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M9 12h6M9 16h6M9 8h2M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
                    <path d="M15 3v5h5"/>
                </svg>
                <h3>Fresh Application</h3>
                <p>First time applying for this scholarship. Start a new registration.</p>
                <button id="FA">Start New Application</button>
            </div>

            <div class="option-card">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                    <path d="M21 3v6h-6"/>
                </svg>
                <h3>Renewal Application</h3>
                <p>Already an awardee. Log in to renew your scholarship for this year.</p>
                <button id="RA" class="secondary">Renew Scholarship</button>
            </div>
        </div>

        <div id="Error-Message" class="alert alert-error" style="max-width:680px; margin:20px auto 0;"></div>
    </main>

    <script src="disburse.js"></script>
</body>
</html>
